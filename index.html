<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#111111" />
    <title>8-Bit Snake — Rắn Săn Mồi Arcade</title>

    <style>

:root {
    --bg:        #111111;
    --panel:     #1c1c1c;
    --line:      #3a3a3a;
    --cell-bg:   #181818;

    --beige:     #e8dcc8;
    --beige-dim: #b8ab97;
    --beige-dk:  #8a7f6d;

    --white:     #ffffff;
    --black:     #000000;
    --grey:      #4a4a4a;
    --tail:      #6b6b6b;

    --wall:      #3f3f3f;
    --wall-line: #8a8a8a;

    --grid-cells: 20;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    min-height: 100%;
}

body {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    line-height: 1.5;
    color: var(--beige);
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    padding: 16px;
    overflow-y: auto;
}

.game-shell {
    width: min(100%, 520px);
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    background: var(--panel);
    border: 1px solid var(--line);
    position: relative;
}

.touch-pad {
    display: none !important;
}

.hud-top {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
}

.game-title {
    display: flex;
    gap: 8px;
    align-items: baseline;
    margin: 0;
    line-height: 1.2;
}

.title-text {
    font-size: 1.5rem;
    font-weight: bold;
    color: var(--beige);
}

.title-text--accent {
    color: var(--beige-dim);
    font-weight: normal;
}

.score-board {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px 20px;
    padding: 8px 14px;
    background: var(--bg);
    border: 1px solid var(--line);
}

.score-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 68px;
    gap: 2px;
}

.score-label {
    font-size: 0.8rem;
    color: var(--beige-dim);
}

.score-value {
    font-size: 1.1rem;
    color: var(--beige);
}

.score-value.bump {
    opacity: 0.6;
}

#level { color: var(--beige-dim); }
#goal  { color: var(--beige-dk); }

.board-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: var(--bg);
    border: 1px solid var(--line);
    padding: 3px;
}

.game-board {
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: repeat(var(--grid-cells), 1fr);
    grid-template-rows: repeat(var(--grid-cells), 1fr);
    background: var(--cell-bg);
    position: relative;
}

.cell {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: visible;
}

.cell--body {
    background: var(--beige-dk);
    border: 1px solid var(--black);
}

.cell--tail {
    background: var(--tail);
    border: 1px solid var(--black);
}

.cell--head {
    background: var(--beige);
    border: 2px solid var(--black);
}

.cell--head::before {
    content: "";
    position: absolute;
    width: 22%;
    height: 22%;
    top: 14%;
    right: 14%;
    background: var(--black);
}

.cell--head::after {
    content: "";
    position: absolute;
    width: 25%;
    height: 25%;
    top: 37.5%;
    left: 100%;
    background: var(--beige);
    border: 1px solid var(--black);
    display: none;
}
.cell--head.tongue-out::after {
    display: block;
}

.cell--head[data-direction="UP"]::before {
    top: 64%;
    right: 64%;
}
.cell--head[data-direction="UP"]::after {
    top: 37.5%;
    left: 62.5%;
}

.cell--head[data-direction="DOWN"]::before {
    top: 14%;
    right: 14%;
}
.cell--head[data-direction="DOWN"]::after {
    top: 62.5%;
    left: 14%;
}

.cell--head[data-direction="LEFT"]::before {
    top: 14%;
    right: 64%;
}
.cell--head[data-direction="LEFT"]::after {
    top: 37.5%;
    left: 12.5%;
}

.cell--food {
    background: var(--beige);
    border: 2px solid var(--black);
}
.cell--food::before {
    content: "";
    position: absolute;
    width: 22%;
    height: 22%;
    top: 12%;
    left: 39%;
    background: var(--grey);
}

.cell--head.game-over-flash {
    background: var(--grey);
    border-color: var(--beige);
}

.cell--wall {
    background: var(--wall);
    border: 1px solid var(--wall-line);
}

.overlay {
    position: absolute;
    inset: 3px;
    background: rgba(17, 17, 17, 0.92);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    opacity: 0;
    pointer-events: none;
}

.overlay--visible {
    opacity: 1;
    pointer-events: auto;
}

.overlay__inner {
    padding: 18px;
    max-width: 88%;
    background: var(--panel);
    border: 1px solid var(--beige-dim);
}

.overlay__inner h2 {
    font-size: 1.6rem;
    margin-bottom: 10px;
    color: var(--beige);
    line-height: 1.3;
}

.overlay__inner p {
    font-size: 1rem;
    line-height: 1.6;
    color: var(--beige-dim);
    margin-bottom: 14px;
}

.overlay__inner .kbd-inline {
    display: inline-block;
    padding: 0 4px;
    background: var(--bg);
    color: var(--beige);
    border: 1px solid var(--beige-dim);
    font-size: 0.9em;
}

.overlay.is-gameover h2 {
    color: var(--grey);
}

.btn-primary {
    appearance: none;
    font-family: inherit;
    font-size: 1rem;
    cursor: pointer;
    background: var(--beige);
    color: var(--black);
    border: 1px solid var(--black);
    padding: 8px 16px;
}
.btn-primary:hover {
    background: var(--beige-dim);
}
.btn-primary:active {
    background: var(--beige-dk);
}

.hud-bottom {
    width: 100%;
    margin-top: 2px;
}

.hint {
    font-size: 0.85rem;
    color: var(--beige-dim);
    line-height: 1.9;
    text-align: center;
}

kbd {
    display: inline-block;
    padding: 0 5px;
    font-family: inherit;
    font-size: 0.85rem;
    background: var(--bg);
    color: var(--beige);
    border: 1px solid var(--beige-dim);
}

@media (min-width: 720px) {
    .game-shell {
        width: 600px;
    }
}

.theme-grassland .game-board {
    background: #1c1c1c;
}

.theme-dungeon .game-board {
    background: #151515;
}

.theme-portal .game-board {
    background: #141414;
}

.theme-haunted .game-board {
    background: #0d0d0d;
}

.theme-matrix .game-board {
    background: #101010;
}

.theme-shadow .game-board {
    background: #0a0a0a;
}

    </style>
</head>
