<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#111111" />
    <title>8-Bit Snake — Rắn Săn Mồi Arcade</title>

    <style>

:root {
    --bg:        #111111;
    --panel:     #1c1c1c;
    --line:      #3a3a3a;
    --cell-bg:   #181818;

    --beige:     #e8dcc8;
    --beige-dim: #b8ab97;
    --beige-dk:  #8a7f6d;

    --white:     #ffffff;
    --black:     #000000;
    --grey:      #4a4a4a;
    --tail:      #6b6b6b;

    --wall:      #3f3f3f;
    --wall-line: #8a8a8a;

    --grid-cells: 20;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    min-height: 100%;
}

body {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    line-height: 1.5;
    color: var(--beige);
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    padding: 16px;
    overflow-y: auto;
}

.game-shell {
    width: min(100%, 520px);
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    background: var(--panel);
    border: 1px solid var(--line);
    position: relative;
}

.touch-pad {
    display: none !important;
}

.hud-top {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
}

.game-title {
    display: flex;
    gap: 8px;
    align-items: baseline;
    margin: 0;
    line-height: 1.2;
}

.title-text {
    font-size: 1.5rem;
    font-weight: bold;
    color: var(--beige);
}

.title-text--accent {
    color: var(--beige-dim);
    font-weight: normal;
}

.score-board {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px 20px;
    padding: 8px 14px;
    background: var(--bg);
    border: 1px solid var(--line);
}

.score-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 68px;
    gap: 2px;
}

.score-label {
    font-size: 0.8rem;
    color: var(--beige-dim);
}

.score-value {
    font-size: 1.1rem;
    color: var(--beige);
}

.score-value.bump {
    opacity: 0.6;
}

#level { color: var(--beige-dim); }
#goal  { color: var(--beige-dk); }

.board-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: var(--bg);
    border: 1px solid var(--line);
    padding: 3px;
}

.game-board {
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: repeat(var(--grid-cells), 1fr);
    grid-template-rows: repeat(var(--grid-cells), 1fr);
    background: var(--cell-bg);
    position: relative;
}

.cell {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: visible;
}

.cell--body {
    background: var(--beige-dk);
    border: 1px solid var(--black);
}

.cell--tail {
    background: var(--tail);
    border: 1px solid var(--black);
}

.cell--head {
    background: var(--beige);
    border: 2px solid var(--black);
}

.cell--head::before {
    content: "";
    position: absolute;
    width: 22%;
    height: 22%;
    top: 14%;
    right: 14%;
    background: var(--black);
}

.cell--head::after {
    content: "";
    position: absolute;
    width: 25%;
    height: 25%;
    top: 37.5%;
    left: 100%;
    background: var(--beige);
    border: 1px solid var(--black);
    display: none;
}
.cell--head.tongue-out::after {
    display: block;
}

.cell--head[data-direction="UP"]::before {
    top: 64%;
    right: 64%;
}
.cell--head[data-direction="UP"]::after {
    top: 37.5%;
    left: 62.5%;
}

.cell--head[data-direction="DOWN"]::before {
    top: 14%;
    right: 14%;
}
.cell--head[data-direction="DOWN"]::after {
    top: 62.5%;
    left: 14%;
}

.cell--head[data-direction="LEFT"]::before {
    top: 14%;
    right: 64%;
}
.cell--head[data-direction="LEFT"]::after {
    top: 37.5%;
    left: 12.5%;
}

.cell--food {
    background: var(--beige);
    border: 2px solid var(--black);
}
.cell--food::before {
    content: "";
    position: absolute;
    width: 22%;
    height: 22%;
    top: 12%;
    left: 39%;
    background: var(--grey);
}

.cell--head.game-over-flash {
    background: var(--grey);
    border-color: var(--beige);
}

.cell--wall {
    background: var(--wall);
    border: 1px solid var(--wall-line);
}

.overlay {
    position: absolute;
    inset: 3px;
    background: rgba(17, 17, 17, 0.92);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    opacity: 0;
    pointer-events: none;
}

.overlay--visible {
    opacity: 1;
    pointer-events: auto;
}

.overlay__inner {
    padding: 18px;
    max-width: 88%;
    background: var(--panel);
    border: 1px solid var(--beige-dim);
}

.overlay__inner h2 {
    font-size: 1.6rem;
    margin-bottom: 10px;
    color: var(--beige);
    line-height: 1.3;
}

.overlay__inner p {
    font-size: 1rem;
    line-height: 1.6;
    color: var(--beige-dim);
    margin-bottom: 14px;
}

.overlay__inner .kbd-inline {
    display: inline-block;
    padding: 0 4px;
    background: var(--bg);
    color: var(--beige);
    border: 1px solid var(--beige-dim);
    font-size: 0.9em;
}

.overlay.is-gameover h2 {
    color: var(--grey);
}

.btn-primary {
    appearance: none;
    font-family: inherit;
    font-size: 1rem;
    cursor: pointer;
    background: var(--beige);
    color: var(--black);
    border: 1px solid var(--black);
    padding: 8px 16px;
}
.btn-primary:hover {
    background: var(--beige-dim);
}
.btn-primary:active {
    background: var(--beige-dk);
}

.hud-bottom {
    width: 100%;
    margin-top: 2px;
}

.hint {
    font-size: 0.85rem;
    color: var(--beige-dim);
    line-height: 1.9;
    text-align: center;
}

kbd {
    display: inline-block;
    padding: 0 5px;
    font-family: inherit;
    font-size: 0.85rem;
    background: var(--bg);
    color: var(--beige);
    border: 1px solid var(--beige-dim);
}

@media (min-width: 720px) {
    .game-shell {
        width: 600px;
    }
}

.theme-grassland .game-board {
    background: #1c1c1c;
}

.theme-dungeon .game-board {
    background: #151515;
}

.theme-portal .game-board {
    background: #141414;
}

.theme-haunted .game-board {
    background: #0d0d0d;
}

.theme-matrix .game-board {
    background: #101010;
}

.theme-shadow .game-board {
    background: #0a0a0a;
}

.cell--portal-a,
.cell--portal-b {
    background: var(--bg);
    border: 2px solid var(--beige);
}
.cell--portal-b {
    border-width: 3px;
    border-color: var(--beige-dim);
}

.cell--food-reverse {
    background: var(--beige-dim);
    border: 2px solid var(--black);
}
.cell--food-speed {
    background: var(--white);
    border: 2px solid var(--black);
}

.toast {
    position: absolute;
    top: 10px;
    left: 0;
    right: 0;
    margin: 0 auto;
    width: max-content;
    max-width: 90%;
    background: var(--panel);
    color: var(--beige);
    font-family: inherit;
    font-size: 0.9rem;
    padding: 6px 12px;
    border: 1px solid var(--beige);
    pointer-events: none;
    opacity: 0;
    z-index: 5;
    white-space: nowrap;
}
.toast.is-visible {
    opacity: 1;
}

.cell--enemy {
    background: var(--black);
    border: 2px solid var(--beige);
    z-index: 4;
}

.cell--enemy-chase {
    background: #2b2b2b;
    border: 3px solid var(--beige);
    outline: 1px solid var(--black);
}

.cell--enemy-warning {
    border: 2px dashed #555555;
    z-index: 1;
}

.cell--fog {
    background: rgba(0, 0, 0, 0.92) !important;
    border-color: #1a1a1a;
}
.cell--fog.cell--head,
.cell--fog.cell--body,
.cell--fog.cell--tail,
.cell--fog.cell--enemy,
.cell--fog.cell--food {
    opacity: 0.1;
}

.cell--arena-wall {
    background: #2a2a2a;
    border: 1px solid var(--wall-line);
    z-index: 0;
}

.score-item--hp {
    min-width: 56px;
}
.hp-value {
    font-size: 1.1rem;
    color: var(--beige);
}
.hp-value .hp-full  { color: var(--beige); }
.hp-value .hp-empty { color: #4a4a4a; }

.cell--invulnerable {
    outline: 2px solid var(--white);
    outline-offset: -2px;
}

.main-menu {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--bg);
    overflow-y: auto;
}
.main-menu--visible {
    display: flex;
}

.main-menu__inner {
    max-width: 1000px;
    width: 100%;
    text-align: center;
}

.menu-title {
    font-size: 2rem;
    color: var(--beige);
    margin-bottom: 6px;
}
.menu-subtitle {
    color: var(--beige-dim);
    font-size: 1rem;
    margin-bottom: 24px;
}

.level-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
}

.level-card {
    --card-accent: #e8dcc8;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 14px;
    text-align: left;
    cursor: pointer;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--beige);
    font-family: inherit;
    position: relative;
}
.level-card:hover,
.level-card:focus-visible {
    border-color: var(--card-accent);
    outline: none;
}

.level-card__num {
    font-size: 0.85rem;
    color: var(--card-accent);
}
.level-card__name {
    font-size: 1.05rem;
    font-weight: bold;
    color: var(--beige);
    line-height: 1.3;
}
.level-card__desc {
    font-size: 0.9rem;
    color: var(--beige-dim);
    line-height: 1.5;
    flex-grow: 1;
}
.level-card__meta {
    font-size: 0.85rem;
    color: var(--beige);
}
.level-card__cta {
    font-size: 0.85rem;
    color: var(--card-accent);
}

.theme-grassland { --card-accent: #e8dcc8; }
.theme-dungeon   { --card-accent: #d8ccb4; }
.theme-portal    { --card-accent: #c8bca4; }
.theme-haunted   { --card-accent: #b8ab97; }
.theme-matrix    { --card-accent: #a89c86; }
.theme-shadow    { --card-accent: #8a7f6d; }

.menu-hint {
    color: var(--beige-dim);
    font-size: 0.9rem;
    margin-top: 4px;
}

.btn-secondary {
    margin-top: 10px;
    padding: 7px 14px;
    background: var(--panel);
    color: var(--beige-dim);
    border: 1px solid var(--line);
    cursor: pointer;
    font-family: inherit;
    font-size: 0.9rem;
}
.btn-secondary:hover,
.btn-secondary:focus-visible {
    color: var(--beige);
    border-color: var(--beige-dim);
    outline: none;
}
    </style>
</head>
<body>
    <main class="game-shell arcade-cabinet">
        <header class="hud-top">
            <h1 class="game-title">
                <span class="title-text">8-BIT</span>
                <span class="title-text title-text--accent">SNAKE</span>
            </h1>
            <div class="score-board" role="status" aria-live="polite">
                <div class="score-item">
                    <span class="score-label">ĐIỂM</span>
                    <span id="score" class="score-value">0</span>
                </div>
                <div class="score-item">
                    <span class="score-label">MÀN</span>
                    <span id="level" class="score-value">1/5</span>
                </div>
                <div class="score-item">
                    <span class="score-label">MỤC TIÊU</span>
                    <span id="goal" class="score-value">100</span>
                </div>
                <div class="score-item">
                    <span class="score-label">KỶ LỤC</span>
                    <span id="high-score" class="score-value">0</span>
                </div>
                <div class="score-item score-item--hp" id="hp-item" hidden>
                    <span class="score-label">MÁU</span>
                    <span id="hp" class="score-value hp-value"></span>
                </div>
            </div>
        </header>

        <div class="board-wrapper">
            <div id="game-board" class="game-board" role="grid" aria-label="Bàn chơi rắn săn mồi 20x20"></div>

            <div id="toast" class="toast" aria-live="polite"></div>

            <div id="overlay" class="overlay overlay--visible" aria-live="assertive">
                <div class="overlay__inner">
                    <h2 id="overlay-title">SẴN SÀNG CHƠI?</h2>
                    <p id="overlay-message">Nhấn phím <span class="kbd-inline">Space</span> để bắt đầu.</p>
                    <button id="overlay-action" type="button" class="btn-primary">BẮT ĐẦU</button>
                    <button id="overlay-back" type="button" class="btn-secondary">⬅ VỀ MENU CHÍNH</button>
                </div>
            </div>
        </div>

        <footer class="hud-bottom">
            <p class="hint">
                <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> hoặc <kbd>WASD</kbd> &nbsp;·&nbsp;
                <kbd>P</kbd> / <kbd>Space</kbd>: Tạm dừng &nbsp;·&nbsp; <kbd>R</kbd>: Chơi lại &nbsp;·&nbsp;
                <kbd>ESC</kbd>: Về menu chính
            </p>
        </footer>
    </main>

    <section id="main-menu" class="main-menu main-menu--visible" aria-label="Menu chọn màn chơi">
        <div class="main-menu__inner">
            <h2 class="menu-title">CHỌN MÀN CHƠI</h2>
            <div class="level-grid" id="level-grid">
            </div>
            <p class="menu-hint">
                 nhấn <kbd>ESC</kbd> để thoát và chọn màn chơi
            </p>
        </div>
    </section>
