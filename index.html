<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#111111" />
    <title>8-Bit Snake — Rắn Săn Mồi Arcade</title>

    <style>

:root {
    --bg:        #111111;
    --panel:     #1c1c1c;
    --line:      #3a3a3a;
    --cell-bg:   #181818;

    --beige:     #e8dcc8;
    --beige-dim: #b8ab97;
    --beige-dk:  #8a7f6d;

    --white:     #ffffff;
    --black:     #000000;
    --grey:      #4a4a4a;
    --tail:      #6b6b6b;

    --wall:      #3f3f3f;
    --wall-line: #8a8a8a;

    --grid-cells: 20;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    min-height: 100%;
}

body {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    line-height: 1.5;
    color: var(--beige);
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    padding: 16px;
    overflow-y: auto;
}

.game-shell {
    width: min(100%, 520px);
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    background: var(--panel);
    border: 1px solid var(--line);
    position: relative;
}

.touch-pad {
    display: none !important;
}

.hud-top {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
}

.game-title {
    display: flex;
    gap: 8px;
    align-items: baseline;
    margin: 0;
    line-height: 1.2;
}

.title-text {
    font-size: 1.5rem;
    font-weight: bold;
    color: var(--beige);
}

.title-text--accent {
    color: var(--beige-dim);
    font-weight: normal;
}

.score-board {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px 20px;
    padding: 8px 14px;
    background: var(--bg);
    border: 1px solid var(--line);
}

.score-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 68px;
    gap: 2px;
}

.score-label {
    font-size: 0.8rem;
    color: var(--beige-dim);
}

.score-value {
    font-size: 1.1rem;
    color: var(--beige);
}

.score-value.bump {
    opacity: 0.6;
}

#level { color: var(--beige-dim); }
#goal  { color: var(--beige-dk); }

.board-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: var(--bg);
    border: 1px solid var(--line);
    padding: 3px;
}

.game-board {
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: repeat(var(--grid-cells), 1fr);
    grid-template-rows: repeat(var(--grid-cells), 1fr);
    background: var(--cell-bg);
    position: relative;
}

.cell {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: visible;
}

.cell--body {
    background: var(--beige-dk);
    border: 1px solid var(--black);
}

.cell--tail {
    background: var(--tail);
    border: 1px solid var(--black);
}

.cell--head {
    background: var(--beige);
    border: 2px solid var(--black);
}

    </style>
</head>
