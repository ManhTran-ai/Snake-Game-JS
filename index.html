<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#111111" />
    <title>8-Bit Snake — Rắn Săn Mồi Arcade</title>

    <style>

:root {
    --bg:        #111111;
    --panel:     #1c1c1c;
    --line:      #3a3a3a;
    --cell-bg:   #181818;

    --beige:     #e8dcc8;
    --beige-dim: #b8ab97;
    --beige-dk:  #8a7f6d;

    --white:     #ffffff;
    --black:     #000000;
    --grey:      #4a4a4a;
    --tail:      #6b6b6b;

    --wall:      #3f3f3f;
    --wall-line: #8a8a8a;

    --grid-cells: 20;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    min-height: 100%;
}

body {
    font-family: "Times New Roman", Times, serif;
    font-size: 16px;
    line-height: 1.5;
    color: var(--beige);
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    padding: 16px;
    overflow-y: auto;
}

    </style>
</head>
